name: 키워드 로컬 Ollama 자동 작성
on:
  push:
    branches: [main]
    paths: ['authoring/keywords.txt']
  workflow_dispatch:
  pull_request:
    paths: ['authoring/keywords.mjs', 'tests/keyword-authoring.test.mjs', '.github/workflows/ollama-keywords.yml']
permissions:
  contents: read
concurrency:
  group: nhunnhun-ollama-keywords
  cancel-in-progress: false
jobs:
  test:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/authoring.test.mjs tests/ollama-authoring.test.mjs tests/keyword-authoring.test.mjs
  write:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 키워드 조사·초안 작성·결과 브랜치 저장
        run: node authoring/keywords.mjs --save-branches
        env:
          OLLAMA_MODEL: qwen3:4b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ollama-keyword-results-${{ github.run_id }}
          path: authoring/results/
          if-no-files-found: ignore
          retention-days: 30
