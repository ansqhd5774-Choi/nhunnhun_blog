name: GPT 직접 작성 원고 발행

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'GPT가 준비한 updates/direct-*.json ID'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nhunnhun-direct-source-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 준비된 원고 연결 — AI 호출 없음
        run: node authoring/direct-dispatch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_ID: ${{ inputs.source_id }}
