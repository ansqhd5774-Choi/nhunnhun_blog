name: GPT 직접 작성 원고 발행

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'GPT가 준비한 updates/direct-*.json ID'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nhunnhun-direct-source-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      # Dispatch must not depend on downloading action archives before any step runs.
      - name: 고정 커밋 준비 — 외부 액션 다운로드 없음
        shell: powershell
        env:
          GH_CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskPath = Join-Path $env:RUNNER_TEMP "direct-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $taskPath -ErrorAction Stop | Out-Null
          Set-Location $taskPath
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_CHECKOUT_TOKEN"))
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $auth"
          try {
            git init --quiet
            if ($LASTEXITCODE -ne 0) { throw 'E_DIRECT_GIT_INIT' }
            git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            git fetch --quiet --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'E_DIRECT_GIT_FETCH' }
            git checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'E_DIRECT_GIT_CHECKOUT' }
            $actual = git rev-parse HEAD
            if ($actual -ne $env:GITHUB_SHA) { throw 'E_DIRECT_SOURCE_DRIFT' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0,Env:GH_CHECKOUT_TOKEN -ErrorAction SilentlyContinue
          }
          "DIRECT_CHECKOUT=$taskPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 로컬 Node와 고정 pnpm 준비
        run: |
          cd /d "%DIRECT_CHECKOUT%"
          node -e "if(Number(process.versions.node.split('.')[0])<24)process.exit(1)"
          if errorlevel 1 exit /b 1
          call npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: 준비된 원고 연결 — AI 호출 없음
        run: |
          cd /d "%DIRECT_CHECKOUT%"
          node authoring/direct-dispatch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_ID: ${{ inputs.source_id }}
