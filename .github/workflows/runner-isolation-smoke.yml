name: Runner isolation smoke
on:
  workflow_dispatch:
    inputs:
      independence_host:
        description: Read-only independent runner host readiness
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'github-hosted') { throw 'WRONG_VALIDATION_RUNNER' }
          Write-Output "VALIDATION_RUNNER_PASS $env:RUNNER_NAME"
  publisher:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 2
    steps:
      - shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="ansqh-tistory-publisher" (echo WRONG_PUBLISH_RUNNER & exit /b 1)
          echo PUBLISH_RUNNER_PASS %RUNNER_NAME%
      - name: Independent repository host readiness (read only)
        if: inputs.independence_host == true
        shell: powershell
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) -Parent
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:LOCALAPPDATA).Substring(0,1))
          $result = @{
            hostName = [Environment]::MachineName
            administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            runnerConfigAvailable = (Test-Path -LiteralPath (Join-Path $runnerRoot 'config.cmd'))
            runnerBinariesAvailable = (Test-Path -LiteralPath (Join-Path $runnerRoot 'bin/Runner.Listener.exe'))
            freeGB = [math]::Round($drive.Free / 1GB)
          }
          Write-Output ('INDEPENDENCE_HOST_READY ' + ($result | ConvertTo-Json -Compress))
