name: Runner isolation smoke
on:
  workflow_dispatch:
    inputs:
      independence_host:
        description: Read-only independent runner host readiness
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'github-hosted') { throw 'WRONG_VALIDATION_RUNNER' }
          Write-Output "VALIDATION_RUNNER_PASS $env:RUNNER_NAME"
  publisher:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 2
    steps:
      - shell: cmd
        run: |
          if /I not "%RUNNER_NAME%"=="ansqh-tistory-publisher" (echo WRONG_PUBLISH_RUNNER & exit /b 1)
          echo PUBLISH_RUNNER_PASS %RUNNER_NAME%
      - name: Independent repository host readiness (read only)
        if: inputs.independence_host == true
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Read independent runner host configuration
        if: inputs.independence_host == true
        shell: cmd
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path'),os=require('node:os'),cp=require('node:child_process');const root=p.dirname(p.dirname(process.env.RUNNER_WORKSPACE));let admin=false;try{cp.execFileSync('net',['session'],{stdio:'ignore'});admin=true;}catch{}const disk=fs.statfsSync(process.env.LOCALAPPDATA);console.log('INDEPENDENCE_HOST_READY '+JSON.stringify({hostName:os.hostname(),administrator:admin,runnerConfigAvailable:fs.existsSync(p.join(root,'config.cmd')),runnerBinariesAvailable:fs.existsSync(p.join(root,'bin/Runner.Listener.exe')),freeGB:Math.round(disk.bavail*disk.bsize/1024**3)}));"
