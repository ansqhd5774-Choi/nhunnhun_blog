name: Recover submitted Tistory update without resubmission

on:
  push:
    branches: [main]
    paths:
      - 'automation/update-recovery-request.txt'

permissions:
  contents: write

concurrency:
  group: nhunnhun-tistory-mutation
  queue: max
  cancel-in-progress: false

jobs:
  verify-existing:
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Parse source-scoped recovery request
        run: node --input-type=module -e "const fs=await import('node:fs');const lines=fs.readFileSync('automation/update-recovery-request.txt','utf8').split(/\r?\n/);const id=(lines[0]||'').trim();if(!/^direct-[a-z0-9-]{2,70}$/.test(id))throw Error('E_RECOVERY_SOURCE_ID');fs.appendFileSync(process.env.GITHUB_ENV,'UPDATE_SOURCE_ID='+id+'\n');console.log('READ_ONLY_RECOVERY_REQUEST '+id);"
      - name: Public QA access diagnostic — read only
        continue-on-error: true
        run: node --input-type=module -e "const {localBrowserConfig,openPublicBrowser}=await import('./publishing/local-browser.mjs');let browser;try{const target='https://nhunnhun.tistory.com/302';const cfg=await localBrowserConfig();console.log('QA_DIAG_CONFIG_PASS');browser=await openPublicBrowser(cfg);console.log('QA_DIAG_BROWSER_PASS');const page=await browser.newPage();let response;try{response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:45000});}catch{throw Error('E_QA_NAVIGATION');}console.log('QA_DIAG_NAV '+JSON.stringify({status:response?.status()??0,ok:response?.ok()??false,url:page.url()}));const canonical=await page.locator('link[rel=canonical]').first().getAttribute('href');const canonicalOk=(()=>{try{return new URL(canonical).href===target}catch{return false}})();const direct=page.locator('.contents_style:has(.nh-direct-v2)');console.log('QA_DIAG_DOM '+JSON.stringify({canonicalPresent:!!canonical,canonicalOk,h1:await page.locator('h1').count(),ogTitle:await page.locator('meta[property=\"og:title\"]').count(),contents:await page.locator('.contents_style').count(),directRoot:await direct.count(),images:await direct.locator('img').count()}));}catch(e){console.error(/^E_[A-Z0-9_]+$/.test(e?.message||'')?e.message:'E_QA_DIAGNOSTIC');process.exitCode=1;}finally{await browser?.close();}"
      - name: Existing submission public verification — no editor, no resubmission
        run: node publishing/finalize-update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ansqhd5774-Choi/nhunnhun_blog
