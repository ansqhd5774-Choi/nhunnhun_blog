name: Assemble verified content standards on isolated branch
on:
  push:
    branches: ['work/content-standard-r1-20261007']
    paths: ['.content-install*', '.github/workflows/apply-content-standard-r1.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/work/content-standard-r1-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/content-standard-r1-20261007
          fetch-depth: 0
      - name: Apply exact pretested changes with before and after hashes
        run: python .content-install.py apply
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate unchanged historical fixtures and current module catalog
        run: node .content-install-generate.mjs
      - name: Verify every final file matches the locally tested content
        run: python .content-install.py verify
      - name: Complete regression suite
        run: pnpm test
      - name: Validate content and unchanged update sources
        run: pnpm run validate:content && pnpm run validate:update
      - name: Offline browser preview
        run: node tests/content-visual.mjs
      - name: Commit only verified non-workflow changes to the isolated branch
        run: python .content-install.py commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assembly-preview
          path: /tmp/nhunnhun-content-preview
          retention-days: 1
          if-no-files-found: warn
