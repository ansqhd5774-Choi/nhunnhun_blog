# Only fixed C996 owner-context evidence. Does not execute DISM, VM operations, ACL changes or blog tasks.
name: C996 owner fixed readonly
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  owner-fixed-readonly:
    if: >-
      github.repository == 'ansqhd5774-Choi/nhunnhun_blog' &&
      github.actor == 'ansqhd5774-Choi' &&
      github.event.issue.user.login == 'ansqhd5774-Choi' &&
      github.event.issue.title == 'c996-owner-fixed-readonly' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authenticate exact request, host, owner and interactive session
        env:
          REQUEST_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module -e "const o=JSON.parse(process.env.REQUEST_BODY);if(Object.keys(o).sort().join(',')!=='operation,schema'||o.schema!=='C996_OWNER_FIXED_READONLY_REQUEST_V1'||o.operation!=='c996-owner-fixed-readonly')process.exit(2)"
          if errorlevel 1 exit /b 2
          if /I not "%COMPUTERNAME%"=="DESKTOP-N62L0NG" exit /b 2
          if /I not "%USERNAME%"=="ansqh" exit /b 2
          powershell.exe -NoProfile -NonInteractive -Command "if ([System.Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { exit 2 }"
          if errorlevel 1 exit /b 2
      - name: Verify only fixed WIM ISO BCD and bounded sanitized DISM-log statistics
        run: node c996-owner/owner-readonly.mjs --run
