name: One-time CLS R3 direct
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cls-r3-only.yml']
permissions:
  contents: write
concurrency:
  group: nhunnhun-cls-r3-direct
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply CLS R3 directly
        shell: bash
        run: |
          set +e
          mkdir -p evidence/admin
          node maintenance/performance-cls-r3.mjs > evidence/admin/performance-cls-r3-direct.log 2>&1
          code=$?
          printf "\nEXIT_CODE=%s\n" "$code" >> evidence/admin/performance-cls-r3-direct.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/admin/performance-cls-r3-direct.log
          git commit -m "evidence: CLS R3 direct 실행 로그" || true
          git push origin HEAD:main || true
          exit "$code"
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
