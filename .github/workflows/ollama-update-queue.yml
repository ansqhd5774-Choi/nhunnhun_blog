name: 기존 글 Queue 로컬 Ollama 자동 수정

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'authoring/update-queue.txt'
      - 'authoring/update-queue.mjs'
      - 'authoring/queue-r53.mjs'
      - 'authoring/update-producer.mjs'
      - 'publishing/content-standards.mjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '공개 변경 없이 1건 생성·검토만 수행'
        type: boolean
        default: true
      article_id:
        description: 'dry_run 대상 숫자 URL ID'
        type: string
        default: '327'
  workflow_run:
    workflows: ['Validate and update Tistory posts']
    types: [completed]
  pull_request:
    paths:
      - 'authoring/update-queue.txt'
      - 'authoring/update-queue.mjs'
      - 'authoring/queue-*.mjs'
      - 'authoring/update-producer.mjs'
      - 'authoring/update-queue-finalize.mjs'
      - 'authoring/update-queue-reconcile.mjs'
      - 'authoring/update-queue-dispatch.mjs'
      - 'authoring/update-queue-summary.mjs'
      - 'authoring/ollama.mjs'
      - 'authoring/keywords.mjs'
      - 'tests/update-queue.test.mjs'
      - 'tests/queue-efficient.test.mjs'
      - 'tests/queue-single-pass.test.mjs'
      - 'publishing/content-standards.mjs'
      - 'publishing/standards/**'
      - 'tests/content-standards.test.mjs'
      - '.github/workflows/ollama-update-queue.yml'
      - '.github/actions/setup-node-pnpm/**'

permissions:
  contents: read

concurrency:
  group: nhunnhun-ollama-update-queue
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'pull_request'
    name: test-${{ matrix.suite }}
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - suite: authoring
            tests: tests/authoring.test.mjs tests/ollama-authoring.test.mjs tests/keyword-authoring.test.mjs tests/update-queue.test.mjs tests/queue-efficient.test.mjs tests/queue-single-pass.test.mjs
          - suite: content
            tests: tests/content-standards.test.mjs tests/content-emphasis.test.mjs tests/content-workflow.test.mjs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test ${{ matrix.tests }}

  produce:
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_run' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CONTENT_UPDATE_QUEUE_ENABLED == 'true')
    needs: reconcile
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 120
    concurrency:
      group: nhunnhun-tistory-mutation
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
    outputs:
      complete: ${{ steps.producer.outputs.complete }}
      article_id: ${{ steps.producer.outputs.article_id }}
      source_id: ${{ steps.producer.outputs.source_id }}
      target_url: ${{ steps.producer.outputs.target_url }}
      source_title: ${{ steps.producer.outputs.source_title }}
      commit_sha: ${{ steps.producer.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 로컬 AI 전용 Gate
        run: node authoring\update-queue.mjs assert-local-only
        env:
          OLLAMA_HOST: http://127.0.0.1:11434

      - name: Queue 1건 작성·취합 — 원고 검사 없음
        id: producer
        run: node authoring\update-producer.mjs
        env:
          OLLAMA_MODEL: qwen3:4b
          OLLAMA_HOST: http://127.0.0.1:11434
          QUEUE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          QUEUE_ARTICLE_ID: ${{ inputs.article_id || '327' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-producer-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: generated-drafts/queue/${{ github.run_id }}/
          if-no-files-found: ignore
          retention-days: 7

  dispatch:
    if: needs.produce.result == 'success' && needs.produce.outputs.complete != 'true' && needs.produce.outputs.source_id != ''
    needs: produce
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.produce.outputs.commit_sha }}
          fetch-depth: 1
          sparse-checkout: authoring
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 기존 수정 workflow 명시 실행
        run: node authoring/update-queue-dispatch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.produce.outputs.commit_sha }}

  reconcile:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 기존 update 완료 상태 1회 확인 — 대기 없이 러너 반환
        run: node authoring/update-queue-reconcile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [test, produce, dispatch, reconcile]
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Queue 성공·실패·남은 항목 요약
        run: node authoring/update-queue-summary.mjs
