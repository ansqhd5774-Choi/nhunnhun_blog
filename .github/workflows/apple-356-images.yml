name: One-time add images to apple post 356
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apple-356-images.yml']
permissions:
  contents: read
concurrency:
  group: nhunnhun-tistory-maintenance
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Add apple images to published post 356
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import Browserbase from '@browserbasehq/sdk';
          import { chromium } from 'playwright-core';
          import { readFile } from 'node:fs/promises';

          const BLOG = 'https://nhunnhun.tistory.com';
          const POST_ID = '356';
          const hero = 'https://upload.wikimedia.org/wikipedia/commons/0/06/Red_apple_fruits.jpg';
          const sliced = 'https://upload.wikimedia.org/wikipedia/commons/9/92/Sliced_apple.jpg';
          const post = JSON.parse(await readFile('posts/apple-benefits-20261002.json', 'utf8'));
          let html = post.bodyHtml;

          const heroBlock = '<p><img src="' + hero + '" alt="붉은 사과 두 개"></p>';
          const slicedBlock = '<p><img src="' + sliced + '" alt="반으로 자른 사과"></p>';
          if (!html.includes(hero)) html = heroBlock + html;
          const anchor = '<h2>3. 사과는 하루에 얼마나 먹으면 좋을까?</h2>';
          if (!html.includes(sliced)) html = html.replace(anchor, slicedBlock + anchor);

          const client = new Browserbase({ apiKey: process.env.BROWSERBASE_API_KEY });
          const session = await client.sessions.create({
            projectId: process.env.BROWSERBASE_PROJECT_ID,
            browserSettings: {
              context: { id: process.env.BROWSERBASE_CONTEXT_ID, persist: true },
              recordSession: false,
              logSession: false,
              solveCaptchas: false
            },
            timeout: 300
          });

          let browser;
          try {
            browser = await chromium.connectOverCDP(session.connectUrl);
            const context = browser.contexts()[0];
            const page = await context.newPage();
            page.setDefaultTimeout(20000);
            page.on('dialog', async dialog => {
              if (dialog.type() === 'confirm') await dialog.accept();
              else await dialog.dismiss();
            });

            await page.goto(BLOG + '/manage/post/' + POST_ID, { waitUntil: 'domcontentloaded' });
            if (new URL(page.url()).origin !== BLOG) throw new Error('E_LOGIN_REQUIRED');
            await page.locator('#post-title-inp').waitFor({ state: 'visible' });
            if ((await page.locator('#post-title-inp').inputValue()).trim() !== post.title) throw new Error('E_WRONG_POST');

            await page.locator('#editor-mode-layer-btn-open').click();
            await page.locator('#editor-mode-html').click();
            const code = page.locator('.CodeMirror:visible .CodeMirror-code');
            await code.waitFor({ state: 'visible' });
            await code.click();
            await page.keyboard.press('ControlOrMeta+A');
            await page.keyboard.insertText(html);

            await page.locator('#publish-layer-btn').click();
            const buttons = page.getByRole('button');
            const candidates = ['공개 발행','수정','변경사항 저장','완료'];
            let submit = null;
            for (const name of candidates) {
              const b = buttons.filter({hasText:name});
              if (await b.count()) { submit = b.last(); break; }
            }
            if (!submit) throw new Error('E_SUBMIT_BUTTON');
            await submit.click();
            await page.waitForTimeout(2500);

            const publicPage = await context.newPage();
            await publicPage.goto(BLOG + '/' + POST_ID, { waitUntil: 'domcontentloaded' });
            const content = publicPage.locator('.contents_style');
            await content.waitFor({ state: 'visible' });
            const htmlNow = await content.innerHTML();
            if (!htmlNow.includes('붉은 사과 두 개') || !htmlNow.includes('반으로 자른 사과')) throw new Error('E_IMAGE_VERIFY');
            console.log('PASS_IMAGE_PATCH: ' + BLOG + '/' + POST_ID);
          } finally {
            try { await browser?.close(); } catch {}
            try { await client.sessions.update(session.id, { projectId: process.env.BROWSERBASE_PROJECT_ID, status: 'REQUEST_RELEASE' }); } catch {}
          }
          NODE

# trigger
