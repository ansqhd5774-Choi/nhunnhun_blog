name: Food CDP lifetime probe without posting
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/food-cdp-lifetime-probe.yml'
permissions:
  contents: read
concurrency:
  group: nhunnhun-tistory-mutation
  queue: max
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 8
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect CDP before Chrome ensure - read-only
        run: node maintenance/tistory-cdp-readonly-diagnostic.mjs
      - name: Ensure existing dedicated Chrome and inspect CDP in the same step
        run: |
          set "RUNNER_TRACKING_ID="
          call maintenance\ensure-tistory-chrome.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          call maintenance\check-tistory-chrome.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          node maintenance/tistory-cdp-readonly-diagnostic.mjs
          node maintenance/tistory-auth-state-readonly.mjs
          rem Classify only the redirect category; never print URL or credentials.
      - name: Inspect CDP after the step boundary - read-only
        run: node maintenance/tistory-cdp-readonly-diagnostic.mjs
