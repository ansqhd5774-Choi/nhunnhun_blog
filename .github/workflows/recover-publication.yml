name: Verify existing publication without resubmission
on:
  workflow_dispatch:
    inputs:
      source_id:
        required: true
        type: string
      public_url:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: nhunnhun-tistory-mutation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node publishing/recover-publication.mjs
        env:
          PUBLISH_SOURCE_ID: ${{ inputs.source_id }}
          RECOVERY_PUBLIC_URL: ${{ inputs.public_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
