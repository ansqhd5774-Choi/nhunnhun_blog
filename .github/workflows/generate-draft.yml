name: 작성 모듈 회귀 테스트 (유료 API 비활성)
on:
  pull_request:
    paths:
      - 'authoring/**'
      - 'tests/authoring.test.mjs'
      - 'tests/ollama-authoring.test.mjs'
      - '.github/workflows/generate-draft.yml'
      - '.github/actions/setup-node-pnpm/**'
permissions:
  contents: read
concurrency:
  group: authoring-regression-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/authoring.test.mjs tests/ollama-authoring.test.mjs tests/keyword-authoring.test.mjs tests/update-queue.test.mjs
