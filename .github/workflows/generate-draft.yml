name: 작성 모듈 회귀 테스트 (유료 API 비활성)
on:
  pull_request:
    paths:
      - 'authoring/**'
      - 'tests/authoring.test.mjs'
      - 'tests/ollama-authoring.test.mjs'
      - '.github/workflows/generate-draft.yml'
      - '.github/actions/setup-node-pnpm/**'
permissions:
  contents: read
concurrency:
  group: authoring-regression-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, Windows, X64, tistory-validation]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          cache-restore-key: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
