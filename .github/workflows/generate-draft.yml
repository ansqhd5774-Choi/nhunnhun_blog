name: 작성 모듈 회귀 테스트 (유료 API 비활성)
on:
  pull_request:
    paths:
      - 'authoring/**'
      - 'tests/authoring.test.mjs'
      - 'tests/ollama-authoring.test.mjs'
      - '.github/workflows/generate-draft.yml'
permissions:
  contents: read
concurrency:
  group: authoring-regression-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: [self-hosted, Windows, X64, tistory-publisher]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
