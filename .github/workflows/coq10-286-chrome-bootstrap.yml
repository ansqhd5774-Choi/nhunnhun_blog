name: One-shot Tistory Chrome bootstrap for CoQ10 286

on:
  push:
    branches: [main]
    paths:
      - 'automation/coq10-286-chrome-bootstrap.txt'

permissions:
  contents: read

concurrency:
  group: nhunnhun-tistory-maintenance
  cancel-in-progress: false

jobs:
  start-chrome:
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Start saved-session Chrome detached from runner cleanup and verify
        run: |
          set "RUNNER_TRACKING_ID="
          call maintenance\ensure-tistory-chrome.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          call maintenance\check-tistory-chrome.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
          ping 127.0.0.1 -n 6 >nul
          call maintenance\check-tistory-chrome.cmd
