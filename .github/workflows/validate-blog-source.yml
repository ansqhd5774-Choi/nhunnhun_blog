name: Validate blog source
on:
  push:
    branches: [main]
    paths:
      - 'skin/proposals/**'
      - 'css/proposals/**'
      - 'maintenance/validate-blog-source.mjs'
      - '.github/workflows/validate-blog-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, tistory-validation]
    defaults:
      run:
        shell: cmd
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node maintenance/validate-blog-source.mjs
