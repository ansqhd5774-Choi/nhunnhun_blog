name: Independent runtime readiness without publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhunnhun-tistory-mutation
  queue: max
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 5
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify local owner and shared physical-host lock without opening editor
        env:
          TISTORY_WRITER_HOST: ${{ vars.TISTORY_WRITER_HOST }}
        run: node maintenance/independent-runtime-smoke.mjs
