name: Refresh Tistory saved login session

on:
  push:
    branches: [main]
    paths:
      - 'automation/tistory-login-refresh.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhunnhun-tistory-login-refresh
  cancel-in-progress: false

jobs:
  login-refresh:
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    timeout-minutes: 7
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open visible dedicated Tistory Chrome in logged-on Windows session
        run: |
          call maintenance\open-visible-tistory-login.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%
      - name: Wait until Chrome CDP is ready
        run: |
          for /L %%I in (1,1,30) do (
            call maintenance\check-tistory-chrome.cmd >nul 2>nul && exit /b 0
            ping 127.0.0.1 -n 2 >nul
          )
          echo E_TISTORY_CDP_START_TIMEOUT
          exit /b 30
      - name: Wait for manual login and save session
        run: node publishing\login.mjs
