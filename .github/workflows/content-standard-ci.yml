name: Content standard CI
on:
  push:
    branches: ['work/content-standard-r1-20261007']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source for isolated implementation and regression tests
        run: git archive --format=zip HEAD -o "${{ runner.temp }}/nhunnhun-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: content-standard-source
          path: ${{ runner.temp }}/nhunnhun-source.zip
          retention-days: 1
          if-no-files-found: error
