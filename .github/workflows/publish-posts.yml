name: Validate and publish Tistory posts
on:
  push:
    branches: [main]
    paths: ['posts/**', 'publishing/**', 'tests/publishing.test.mjs', 'package.json', 'pnpm-lock.yaml', '.github/workflows/publish-posts.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhunnhun-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm validate
  publish:
    concurrency:
      group: nhunnhun-tistory-publish
      cancel-in-progress: false
    needs: validate
    if: vars.TISTORY_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run publish
        # The checked-out main commit may be newer than the push that triggered this run.
        env:
          PUBLISH_ENABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}

      - name: Apply CLS reserve R1
        run: node maintenance/performance-cls-r1.mjs
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}

# performance-cls-r1

# pr-trigger-performance-cls-r1

# pr-trigger-performance-cls-r1-cdn-fix

# pr-trigger-performance-cls-r1-final

      - name: Apply CLS reserve R2
        shell: bash
        run: |
          set +e
          mkdir -p evidence/admin
          node maintenance/performance-cls-r2.mjs > evidence/admin/performance-cls-r2.log 2>&1
          code=$?
          printf "\nEXIT_CODE=%s\n" "$code" >> evidence/admin/performance-cls-r2.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/admin/performance-cls-r2.log
          git commit -m "evidence: CLS R2 실행 로그" || true
          git push origin HEAD:main || true
          exit "$code"
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}

# performance-cls-r2

# pr-trigger-performance-cls-r2

# cls-r2-evidence-trigger
