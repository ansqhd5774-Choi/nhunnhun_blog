name: Validate and publish Tistory posts
on:
  push:
    branches: [main]
    paths: ['posts/**', 'publishing/**', 'tests/publishing.test.mjs', 'package.json', 'pnpm-lock.yaml', '.github/workflows/publish-posts.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhunnhun-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ansqhd5774-Choi/nhunnhun_blog
  publish:
    concurrency:
      group: nhunnhun-tistory-publish
      cancel-in-progress: false
    needs: validate
    if: vars.TISTORY_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ansqhd5774-Choi/nhunnhun_blog
      - run: pnpm run publish
        # Validate and publish use the same checked-out current main. publish.mjs also rechecks remote main immediately before final submit.
        env:
          PUBLISH_ENABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


