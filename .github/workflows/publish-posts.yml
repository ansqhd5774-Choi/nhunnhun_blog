name: Validate and publish Tistory posts
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'publishing/publish.mjs'
      - 'publishing/runner-gate.mjs'
      - 'tests/runner-gate.test.mjs'
      - 'publishing/validate.mjs'
      - 'publishing/core.mjs'
      - 'publishing/editorial.mjs'
      - 'publishing/ledger.mjs'
      - 'publishing/local-browser.mjs'
      - 'publishing/mutation-gate.mjs'
      - 'maintenance/ensure-tistory-chrome.cmd'
      - 'maintenance/stop-tistory-chrome.mjs'
      - 'tests/publishing.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-posts.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish one pending post'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: nhunnhun-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.mutation-gate.outputs.should_mutate }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Mutation gate
        id: mutation-gate
        run: node publishing/mutation-gate.mjs posts
        env:
          MUTATION_REQUESTED: ${{ inputs.publish }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Diagnose self-hosted allocation
        run: node publishing/runner-gate.mjs --queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test
      - run: pnpm validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ansqhd5774-Choi/nhunnhun_blog
  publish:
    concurrency:
      group: nhunnhun-tistory-publish
      cancel-in-progress: false
    needs: validate
    if: vars.TISTORY_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.validate.outputs.should_publish == 'true'
    runs-on: [self-hosted, windows, x64, tistory-publisher]
    defaults:
      run:
        shell: cmd
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Runner evidence and source drift Gate A
        run: node publishing/runner-gate.mjs
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ansqhd5774-Choi/nhunnhun_blog
      - name: Stop always-on Chrome before isolated publisher
        run: node maintenance/stop-tistory-chrome.mjs
      - run: pnpm run publish
        # Validate and publish use the same checked-out current main. publish.mjs also rechecks remote main immediately before final submit.
        env:
          PUBLISH_ENABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore always-on Chrome
        if: always()
        run: |
          if exist C:\actions-runner\maintenance.stop del /q C:\actions-runner\maintenance.stop
          call maintenance\ensure-tistory-chrome.cmd


