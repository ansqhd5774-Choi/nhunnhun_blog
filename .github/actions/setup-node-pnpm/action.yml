name: Setup Node
description: Shared Node 24 setup for NHUNNHUN workflows.
inputs:
  cache-key:
    description: Reserved cache key supplied by workflow.
    required: false
  cache-restore-key:
    description: Reserved restore prefix supplied by workflow.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
